services:
  redrope-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: redrope-app

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      NODE_ENV: production
      WAIT_FOR_DB: "true"
      SPRING_PROFILES_ACTIVE: docker

      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      TZ: Asia/Seoul

    restart: on-failure

    volumes:
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    networks:
      - redrope-net

  db:
    image: mysql:8

    container_name: redrope-db

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Seoul

    volumes:
      - mysql-data:/var/lib/mysql

    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - redrope-net

  redis:
    image: redis:7.2

    container_name: redrope-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    restart: on-failure

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - redrope-net

volumes:
  redis-data:
  mysql-data:

networks:
  redrope-net:
